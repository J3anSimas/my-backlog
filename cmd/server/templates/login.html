<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — My Backlog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #1a1a2e; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: .85rem; font-weight: 600; color: #444; margin-bottom: .35rem; }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      padding: .55rem .75rem;
      border: 1.5px solid #cdd3db;
      border-radius: 6px;
      font-size: .95rem;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: #4f6ef7; }
    .toggle-pw {
      position: absolute;
      right: .6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      font-size: .8rem;
      padding: .2rem .4rem;
    }
    .btn {
      width: 100%;
      padding: .65rem;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .global-error {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 6px;
      padding: .6rem .85rem;
      color: #c53030;
      font-size: .87rem;
      margin-bottom: 1rem;
    }
    .footer-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .87rem;
      color: #555;
    }
    .footer-link a { color: #4f6ef7; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card"
       x-data="loginForm()"
       x-init="init()">

    <h1>Entrar</h1>

    <div class="global-error" x-show="globalError" x-text="globalError" style="display:none"></div>

    <form @submit.prevent="submit">

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email"
               x-model="fields.email"
               autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <input id="password" :type="showPw ? 'text' : 'password'" name="password"
                 x-model="fields.password"
                 autocomplete="current-password" />
          <button type="button" class="toggle-pw" @click="showPw = !showPw"
                  :aria-label="showPw ? 'Ocultar senha' : 'Mostrar senha'">
            <span x-text="showPw ? 'ocultar' : 'mostrar'"></span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn" :disabled="loading">
        <span x-show="!loading">Entrar</span>
        <span x-show="loading" style="display:none">Aguarde…</span>
      </button>

    </form>

    <p class="footer-link">Não tem conta? <a href="/register">Criar conta</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
  <script>
    function loginForm() {
      return {
        fields:      { email: '', password: '' },
        globalError: '',
        loading:     false,
        showPw:      false,

        init() {},

        async submit() {
          this.globalError = '';
          this.loading     = true;

          try {
            const body = new URLSearchParams(this.fields);
            const res  = await fetch('/login', {
              method:  'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body:    body.toString(),
            });

            if (res.redirected) {
              window.location.href = res.url;
              return;
            }
            if (res.status === 303) {
              window.location.href = res.headers.get('Location') || '/home';
              return;
            }
            if (res.status === 401) {
              const data = await res.json();
              this.globalError = data.message || 'Credenciais inválidas.';
              return;
            }
            this.globalError = 'Erro inesperado. Tente novamente.';
          } catch {
            this.globalError = 'Falha de conexão. Tente novamente.';
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
